
name: Deploy Wasser-Phasenlabor

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js 24 einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Abhängigkeiten installieren
        run: npm install

      - name: TypeScript prüfen
        run: npm run typecheck

      - name: Tests ausführen
        run: npm test

      - name: Produktionsabhängigkeiten prüfen
        run: npm audit --omit=dev --audit-level=high

      - name: Vollständigen Dependency-Audit durchführen
        shell: bash
        run: |
          if npm audit --audit-level=high; then
            echo "Keine hohen oder kritischen Sicherheitslücken gefunden."
          else
            echo "::warning::Sicherheitslücken gefunden. Siehe Audit-Bericht. Deployment wird fortgesetzt."
          fi

      - name: GitHub-Pages-Basis setzen
        run: echo "VITE_BASE=/aggregat_sim/" >> "$GITHUB_ENV"

      - name: Projekt bauen
        run: npm run build

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v6

      - name: Build-Artefakt hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-24.04
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
